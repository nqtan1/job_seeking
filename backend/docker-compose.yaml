services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  firebase-emulator:
    build:
      context: ./docker
      dockerfile: firebase-emulator.Dockerfile
    ports:
      - "9099:9099"
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:9099/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
