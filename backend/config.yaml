# Non-secret settings (committable). URLs and keys stay in .env.
# Precedence: env vars > .env > this file > defaults. Keys are the lowercase Settings field names.
app_check_enforced: false   # local only; prod can never disable it
ai_call_timeout_s: 180      # the self-hosted Qwen models are slow (a CV took >30 s)

qwen_model_name: slm        # default Qwen text model
qwen_vl_model_name: vlm     # used automatically when an input contains an image
gemini_flash_lite: gemini-3.5-flash-lite # Gemini "fast" tier
gemini_flash: gemini-3.5-flash-lite             # Gemini "smart" tier

# Agents: cv_extract, job_extract, fit, letter, letter_assist, coach
agents:
  cv_extract: {provider: gemini, model: gemini-3.5-flash-lite}
  job_extract: {provider: gemini, model: gemini-3.5-flash-lite}
  fit: {provider: gemini, model: gemini-3.5-flash-lite}
  letter: {provider: gemini, model: gemini-3.5-flash-lite}
  letter_assist: {provider: gemini, model: gemini-3.5-flash-lite}
  coach: {provider: gemini, model: gemini-3.5-flash-lite}
