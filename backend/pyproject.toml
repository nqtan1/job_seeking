[project]
name = "job-seeking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.136.1",
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.6.3",
    "pdfplumber>=0.11.9",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.6.0",
    "pylatex>=1.4.2",
    "python-multipart>=0.0.26",
    "uvicorn>=0.46.0",
    "vertexai>=1.71.1",
    "beautifulsoup4>=4.12.3",
    "google-genai>=1.73.1",
    "openai>=3.17.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "psycopg[binary,pool]>=3.3.6",
    "alembic>=1.20.0",
    "procrastinate>=3.10.0",
    "firebase-admin>=6.9.0",
    "google-cloud-storage>=2.19.0",
    "jinja2>=3.1.6",
    "uuid-utils>=0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruitai"]

[tool.ruff]
target-version = "py313"
extend-exclude = [
    "./main.py",
    "./api",
    "./application",
    "./domain",
    "./infrastructure",
    "./workers",
    "./migrations",
    "./core",
    "./utils",
    "./config",
    "./tests_legacy",
]

[tool.mypy]
files = ["src"]
strict = true
exclude = '^(main\.py|api|application|domain|infrastructure|workers|migrations|core|utils|config|tests_legacy)/?'

[tool.importlinter]
root_package = "recruitai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "config has no FastAPI dependency"
type = "forbidden"
source_modules = ["recruitai.config"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "core.db has no FastAPI dependency"
type = "forbidden"
source_modules = ["recruitai.core.db"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "core.errors has no web framework dependency"
type = "forbidden"
source_modules = ["recruitai.core.errors"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core.logging has no web framework dependency"
type = "forbidden"
source_modules = ["recruitai.core.logging"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "config does not depend on main"
type = "forbidden"
source_modules = ["recruitai.config"]
forbidden_modules = ["recruitai.main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.9",
]
