[project]
name = "job-seeking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.136.1",
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.6.3",
    "pdfplumber>=0.11.9",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.6.0",
    "pylatex>=1.4.2",
    "python-multipart>=0.0.26",
    "uvicorn>=0.46.0",
    "vertexai>=1.71.1",
    "beautifulsoup4>=4.12.3",
    "google-genai>=1.73.1",
    "openai>=3.17.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "psycopg[binary,pool]>=3.3.6",
    "alembic>=1.20.0",
    "procrastinate>=3.10.0",
    "firebase-admin>=6.9.0",
    "google-cloud-storage>=2.19.0",
    "jinja2>=3.1.6",
    "uuid-utils>=0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruitai"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.9",
]
