[project]
name = "job-seeking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "fastapi[standard]>=0.136.1",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.26",
    "uvicorn>=0.46.0",
    "google-genai>=1.73.1",
    "openai>=3.17.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "psycopg[binary,pool]>=3.3.6",
    "alembic>=1.20.0",
    "procrastinate>=3.10.0",
    "firebase-admin>=6.9.0",
    "google-cloud-storage>=2.19.0",
    "jinja2>=3.1.6",
    "uuid-utils>=0.14.1",
    "pypdf>=6.21.4",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "tzdata>=2026.1",  # zoneinfo in the slim images (schedules use IANA time zones)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruitai"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.api_core.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "recruitai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "config has no FastAPI dependency"
type = "forbidden"
source_modules = ["recruitai.config"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "core.db has no FastAPI dependency"
type = "forbidden"
source_modules = ["recruitai.core.db"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "core.errors has no web framework dependency"
type = "forbidden"
source_modules = ["recruitai.core.errors"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core.logging has no web framework dependency"
type = "forbidden"
source_modules = ["recruitai.core.logging"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core.storage has no web framework dependency"
type = "forbidden"
source_modules = ["recruitai.core.storage"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core.tasks has no web framework dependency"
type = "forbidden"
source_modules = ["recruitai.core.tasks"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "config does not depend on main"
type = "forbidden"
source_modules = ["recruitai.config"]
forbidden_modules = ["recruitai.main"]

[[tool.importlinter.contracts]]
name = "agents.helpers does not depend on flows, blocks, contacts or connections"
type = "forbidden"
source_modules = ["recruitai.modules.agents.helpers"]
forbidden_modules = ["recruitai.modules.agents.flows", "recruitai.modules.agents.blocks", "recruitai.modules.agents.contacts", "recruitai.modules.agents.connections"]
# the neutral agents.versioning (used by flows too) knows both models: indirect links are fine
allow_indirect_imports = true
[[tool.importlinter.contracts]]
name = "agents.blocks does not depend on the flow service, engine, schedules or any router"
type = "forbidden"
source_modules = ["recruitai.modules.agents.blocks"]
forbidden_modules = ["recruitai.modules.agents.flows.service", "recruitai.modules.agents.flows.runs", "recruitai.modules.agents.flows.router", "recruitai.modules.agents.flows.engine", "recruitai.modules.agents.flows.schedules", "recruitai.modules.agents.flows.starters", "recruitai.modules.agents.helpers.service", "recruitai.modules.agents.helpers.router", "recruitai.modules.agents.contacts.router", "recruitai.modules.agents.connections.router"]

[[tool.importlinter.contracts]]
name = "agents.contacts and agents.connections do not depend on flows or helpers"
type = "forbidden"
source_modules = ["recruitai.modules.agents.contacts", "recruitai.modules.agents.connections"]
forbidden_modules = ["recruitai.modules.agents.flows", "recruitai.modules.agents.helpers"]
[[tool.importlinter.contracts]]
name = "outside code reaches agents only through its public entry points"
type = "forbidden"
source_modules = ["recruitai.modules.applications", "recruitai.modules.candidates", "recruitai.modules.coach", "recruitai.modules.documents", "recruitai.modules.identity", "recruitai.modules.jobs", "recruitai.modules.letters", "recruitai.modules.matching", "recruitai.modules.privacy", "recruitai.modules.radar", "recruitai.main", "recruitai.worker", "recruitai.models"]
forbidden_modules = ["recruitai.modules.agents.deps", "recruitai.modules.agents.base", "recruitai.modules.agents.versioning", "recruitai.modules.agents.flows.engine", "recruitai.modules.agents.flows.graph", "recruitai.modules.agents.flows.repository", "recruitai.modules.agents.flows.schedules", "recruitai.modules.agents.flows.schemas", "recruitai.modules.agents.flows.starters", "recruitai.modules.agents.helpers.repository", "recruitai.modules.agents.helpers.runner", "recruitai.modules.agents.helpers.schemas", "recruitai.modules.agents.contacts.service", "recruitai.modules.agents.contacts.repository", "recruitai.modules.agents.connections.service", "recruitai.modules.agents.connections.repository", "recruitai.modules.agents.blocks.catalogue", "recruitai.modules.agents.blocks.tools"]
allow_indirect_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real LLM servers; needs RUN_LIVE_LLM=1, never runs in CI"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.9",
]
