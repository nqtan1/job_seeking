# Non-secret settings baked into the production images (copied to /app/config.yaml).
# ENV=prod allows only Gemini on Vertex. Project, location and credentials come from the
# environment / Cloud Run service account, never from this file.
# Letters on the "smart" model sometimes need >30 s (the default). A timeout is not retried, but
# invalid output is retried once: 2 x 60 s still fits the API's 120 s Cloud Run request timeout.
ai_call_timeout_s: 120

# Job-focused coach (ADR 0023): off until the owner enables it.
coach_job_focus: false

agents:
  cv_extract: {provider: gemini, model: gemini-3.5-flash-lite}
  job_extract: {provider: gemini, model: gemini-3.5-flash-lite}
  job_query: {provider: gemini, model: gemini-3.5-flash-lite}
  interview_prep: {provider: gemini, model: gemini-3.8-flash}
  fit: {provider: gemini, model: gemini-3.8-flash}
  # Vertex location is "eu": gemini-3.1-pro-preview and gemini-2.5-* are 404 there (checked 2026-10-15,
  # they exist only in "global"); gemini-3.5-flash hung >50 s on letters (2026-10-07), 3.7-flash timed
  # out at 120 s, 3.5-flash-lite wrote 103 of 250 words. 3.8-flash: grounded, ~20 s.
  letter: {provider: gemini, model: gemini-3.8-flash}
  letter_assist: {provider: gemini, model: gemini-3.5-flash-lite}
  coach: {provider: gemini, model: gemini-3.8-flash}