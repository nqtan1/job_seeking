name: Set up web
description: pnpm and Node with their cache, and the frozen web dependencies

inputs:
  install:
    description: Install the dependencies (pnpm install --frozen-lockfile)
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - if: inputs.install == 'true'
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
