name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  new-code:
    name: new-code (recruitai)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy --strict src

      - name: import-linter
        run: uv run lint-imports

      - name: pytest (tests_v2)
        env:
          ENV: local
        run: uv run pytest

  legacy-tests:
    name: legacy-tests (frozen suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install LaTeX toolchain (motivation letter PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-lang-french

      - name: Provide agent config (gitignored, example values for CI)
        run: cp config/agent_config.yaml.example config/agent_config.yaml

      - name: Legacy pytest
        run: uv run pytest tests/
