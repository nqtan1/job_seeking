name: CI

# Runs on pull requests, and is called by cd.yml for every push to main / tag, so a deploy
# can never start from a red commit (and CI runs once per push, not twice).
#
# One job per question, named "Group · what it checks", so the Checks tab says what kind of problem
# it is and one job can be re-run alone. "CI passed" is the single summary status.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:   # Actions tab > CI > Run workflow, on any branch

permissions:
  contents: read

# a new push to a pull request cancels its superseded run; runs on main are never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- quality
  quality-backend-lint:
    name: Quality · backend lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  quality-backend-types:
    name: Quality · backend types (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: mypy
        run: uv run mypy --strict src

  quality-web-lint:
    name: Quality · web lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm exec prettier --check .

  quality-web-types:
    name: Quality · web types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Typecheck
        run: pnpm typecheck

  # ----------------------------------------------------------- architecture
  architecture-imports:
    name: Architecture · import rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: import-linter
        run: uv run lint-imports

  # ---------------------------------------------------------------- security
  security-backend:
    name: Security · backend dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
        with:
          sync: "false"
      - name: pip-audit (locked runtime dependencies)
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip

  security-web:
    name: Security · web dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
        with:
          install: "false"
      - name: Audit (production dependencies)
        run: pnpm audit --prod

  # ------------------------------------------------------------------- tests
  # One job per test group (which file is in which group: backend/tests/ci_group.sh). The database
  # group also proves that an empty database reaches the newest schema, one step back and forward.
  tests-backend:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: database, name: "Database · migrations and constraints" }
          - { group: unit, name: "Tests · backend unit" }
          - { group: platform, name: "Tests · platform (helpers, flows, connections)", emulator: true }
          - { group: accounts, name: "Tests · accounts and privacy", emulator: true }
          - { group: product, name: "Tests · product (jobs, letters, coach, radar)", emulator: true }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENV: local
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitai_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - if: matrix.emulator
        uses: ./.github/actions/start-emulator
      - if: matrix.group == 'database'
        name: Migrations apply, roll back one step and apply again
        env:
          FIREBASE_PROJECT_ID: demo-recruitai
          PGPASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitai_migrations
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE recruitai_migrations"
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: pytest (${{ matrix.group }})
        run: bash tests/ci_group.sh ${{ matrix.group }}

  tests-web:
    name: Tests · web unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Unit tests
        run: pnpm test --run

  # ---------------------------------------------------------------- contract
  # Drift check: regenerate the API types from the real app's OpenAPI and fail if the
  # committed schema.d.ts differs (a backend response-model change without `pnpm gen:api`).
  contract-api-types:
    name: Contract · API types in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-backend

      - name: Start the API (OpenAPI source)
        working-directory: backend
        env:
          ENV: local
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitai
          FIREBASE_PROJECT_ID: demo-recruitai
          APP_CHECK_ENFORCED: "false"
        run: |
          nohup uv run uvicorn recruitai.main:app --port 8000 > /tmp/api.log 2>&1 &
          curl --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors -fsS http://localhost:8000/openapi.json > /dev/null

      - name: OpenAPI drift check
        working-directory: web
        run: pnpm check:api

  # ------------------------------------------------------------------- build
  build-web:
    name: Build · web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Build
        run: pnpm build

  # ------------------------------------------------------------------ docker
  docker:
    name: "Docker · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, name: api image }
          - { image: worker, name: worker image (offline letters) }
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.image }} image
        run: docker build -f Dockerfile.${{ matrix.image }} -t recruitai-${{ matrix.image }}:ci .
      - name: ${{ matrix.image }} image runs as non-root
        run: |
          user="$(docker run --rm recruitai-${{ matrix.image }}:ci whoami)"
          test "$user" = "app"
      - if: matrix.image == 'worker'
        name: Tectonic compiles offline (package bundle pre-warmed at build time, ADR 0010)
        run: |
          docker run --rm --network none recruitai-worker:ci sh -c \
            "mkdir -p /tmp/out && cp /app/docker/sample.tex /tmp/out/ && cp /app/docker/sample-signature.png /tmp/out/signature.png && tectonic -X compile --untrusted --outdir /tmp/out /tmp/out/sample.tex && test -s /tmp/out/sample.pdf"
      - if: matrix.image == 'worker'
        name: worker image compiles every letter template offline (P2-20)
        run: docker run --rm --network none recruitai-worker:ci python /app/docker/render_check.py

  # --------------------------------------------------------------------- e2e
  # Runs at the same time as everything else: it is the longest job, so waiting for the cheap
  # checks would only make the whole run slower.
  e2e:
    name: E2E · browser journeys (Playwright, canned LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_WEB_PORT: "5174"
      E2E_API_URL: http://localhost:8011
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
        with:
          install: "false"
      - uses: ./.github/actions/setup-backend
        with:
          sync: "false"
      - uses: ./.github/actions/start-emulator

      - name: Start Postgres
        working-directory: backend
        run: docker compose up -d --no-build --wait postgres

      # The same isolated stack as locally: own database, API on :8011, scripted worker
      # (canned LLM and job-search data), queue schema applied.
      - name: Migrate and start the API and the worker
        working-directory: backend
        run: |
          uv sync --locked
          bash tests/e2e_stack.sh up

      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Playwright journeys
        working-directory: web
        run: pnpm e2e

      - name: Upload Playwright traces and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            web/test-results
            backend/.e2e-run/*.log

  # ----------------------------------------------------------------- summary
  # The one status to look at (and, later, to require in branch protection). It runs even when a
  # job failed, and fails if any job failed, was cancelled or was skipped.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - quality-backend-lint
      - quality-backend-types
      - quality-web-lint
      - quality-web-types
      - architecture-imports
      - security-backend
      - security-web
      - tests-backend
      - tests-web
      - contract-api-types
      - build-web
      - docker
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "At least one job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
